---
- hosts: k8s
  become: true
  gather_facts: yes
  vars:
    username: "ubuntu"
    kubeseal_version: "0.19.3"
  vars_files:
    - parameters/secrets.yml
  pre_tasks:
    - name: Set a hostname
      hostname:
        name: "{{ vagrant_hostname | default('vm-k8s') }}"
  roles:
    - name: newrelic.newrelic-infra
      vars:
        nrinfragent_config:
          license_key: "{{ NEWRELIC_LICENSE_KEY }}"
      when: "(vagrant_hostname is not defined) or (vagrant_hostname|length == 0)"
    - name: automaticPackageUpdate
      vars:
        notification_url: "{{ GOSMTP_NOTIFICATION_URL }}"
        additional_repository_origins:
          - ". ${distro_codename}:${distro_codename}" # Fluent Bit
    - name: node_exporter
      vars:
        node_exporter_args:
          - --collector.processes
          - --collector.netdev.device-exclude="cali.*"
          - --collector.netclass.ignored-devices="cali.*"
          # --collector.arp.exclude="cali.*" requires 1.4.0+
    - name: fluentbit
      vars:
        fluentbit_credentials:
          - name: GRAFANA_LOKI_USER
            value: "{{ LOKI_AUTH_URL | urlsplit('username') }}"
          - name: GRAFANA_LOKI_PASSWORD
            value: "{{ LOKI_AUTH_URL | urlsplit('password') }}"
        fluentbit_custom_config_file_content: |
          service:
            #flush: 1
            #log_level: info
            # Configure this to load your custom parser if required
            parsers_file: {{ fluentbit_parser_file_path }}

          env:
            - name: GRAFANA_LOKI_USER
              uri: file:///run/credentials/fluent-bit.service/GRAFANA_LOKI_USER
            - name: GRAFANA_LOKI_PASSWORD
              uri: file:///run/credentials/fluent-bit.service/GRAFANA_LOKI_PASSWORD

          pipeline:
            inputs:
              - name: kmsg
                tag: kernel

              - name: systemd
                tag: systemd
                read_from_tail: on

              - name: tail
                tag: unattended-upgrades
                path: /var/log/unattended-upgrades/unattended-upgrades.log
                multiline.parser: unattended_upgrades
                read_from_head: true
            filters:
              - name: parser
                match: 'unattended-upgrades'
                key_name: log
                parser: unattended_upgrades
            outputs:
              - name: loki
                match_regex: '^(kernel|systemd|unattended-upgrades)$'
                host: {{ LOKI_AUTH_URL | urlsplit("hostname") }}
                port: {{ LOKI_AUTH_URL | urlsplit("port") }}
                tls: on
                tls.verify: on
                http_user: ${GRAFANA_LOKI_USER}
                http_passwd: ${GRAFANA_LOKI_PASSWORD}
                labels: job=fluent-bit, host={{ ansible_hostname }}, source=$TAG, SYSTEMD_UNIT=$_SYSTEMD_UNIT
        fluentbit_parser_file_content: |
          parsers:
            - name: unattended_upgrades
              format: regex
              regex: '^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) (?<message>.*)$'
              time_key: timestamp
              time_format: '%Y-%m-%d %H:%M:%S,%L'
          multiline_parsers:
            - name: unattended_upgrades
              type: regex
              flush_timeout: 1000

              rules:
                - state: start_state
                  regex: '/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} [A-Z]+ /'
                  next_state: cont
                - state: cont
                  regex: '/^(?!\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} [A-Z]+ ).*/'
                  next_state: cont
  tasks:
    - name: Install required packages
      snap:
        name:
          - microk8s
          - kubectl
          - terraform
        classic: yes
        state: present
    - name: Add microk8s to the user's groups
      user:
        name: "{{ username }}"
        groups: microk8s
        append: yes
    - name: Enable storage microk8s addon
      command:
        cmd: microk8s enable storage
    - name: Enable DNS microk8s addon
      command:
        cmd: microk8s enable dns
    - name: Enable ingress microk8s addon
      command:
        cmd: microk8s enable ingress
    - name: Enable metrics-server microk8s addon
      command:
        cmd: microk8s enable metrics-server
    # - name: Reset connection so docker group is picked up.
    #   meta: reset_connection
    - name: Install kubeseal {{ kubeseal_version }}
      unarchive:
        src: https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz
        dest: /usr/local/bin/
        remote_src: yes
        creates: /kubeseal
        # in this version of module, we don't have include parameter
        exclude:
          - LICENSE
          - README.md
    - name: Create .kube directory
      become: no
      file:
        path: ~/.kube
        state: directory
        mode: '0750'
    - name: Display kubectl configuration for {{ username }}
      command:
        cmd: microk8s config
        #creates: ~/.kube/config
      register: kubectl_config
      become: no
    - name:
      copy:
        content:  "{{  kubectl_config.stdout  }}"
        dest: ~/.kube/config
        mode: '0640'
      become: no
    - import_tasks: ./tasks/homeassistant.yml
    - import_tasks: ../common/wazuh-agent.yml
  handlers:
    - name: Restart node_exporter
      service:
        name: prometheus-node-exporter
        state: restarted
