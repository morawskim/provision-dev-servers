- name: Create credential {{ credential.name }}
  ansible.builtin.copy:
    dest: /etc/fluent-bit/{{ credential.name }}.cred
    owner: root
    group: root
    mode: '0600'
    content: "{{ credential.value }}"
  loop: "{{ fluentbit_credentials }}"
  loop_control:
    loop_var: credential
  notify: Restart fluent-bit
- name: Add LoadCredential override
  ansible.builtin.copy:
    dest: /etc/systemd/system/fluent-bit.service.d/credentials.conf
    mode: "0644"
    content: |
      [Service]
      {% for credential in fluentbit_credentials %}
      LoadCredential={{ credential.name }}:/etc/fluent-bit/{{ credential.name }}.cred
      {% endfor %}
  notify: Restart fluent-bit
