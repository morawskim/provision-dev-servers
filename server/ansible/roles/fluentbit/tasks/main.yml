---
- name: Install fluent-bit (Ubuntu)
  ansible.builtin.include_tasks: ubuntu.yml
  when:
    - ansible_os_family == "Debian"
- name: Install fluent-bit (Rocky)
  ansible.builtin.include_tasks: rocky.yml
  when:
    - ansible_os_family == "RedHat"

- name: Create custom config file for fluent-bit
  copy:
    content: "{{ fluentbit_custom_config_file_content | default('') }}"
    dest: "{{ fluentbit_custom_config_file_path }}"
    group: root
    owner: root
    mode: 0640
  notify: Restart fluent-bit

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/fluent-bit.service.d
    state: directory
    mode: "0755"
- name: Overwrite path to configuration file
  ansible.builtin.copy:
    dest: /etc/systemd/system/fluent-bit.service.d/exec-config-file.conf
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=/opt/fluent-bit/bin/fluent-bit -c //etc/fluent-bit/custom.yaml
  notify: Restart fluent-bit

- name: Include credential task
  ansible.builtin.include_tasks: credential.yml
  when:
    - fluentbit_credentials is defined
    - fluentbit_credentials | length > 0

- name: Add a line to the fluent-bit configuration
  lineinfile:
    path: /etc/fluent-bit/fluent-bit.conf
    line: "@INCLUDE {{ fluentbit_custom_config_file_path }}"
# Note (?m) which turns on MULTILINE mode so ^ matches any line's beginning
- name: Comment OUTPUT section block
  replace:
    path: /etc/fluent-bit/fluent-bit.conf
    after: '(?m)^\[OUTPUT\]'
    before: '^[^\s]'
    regexp: '^(.+)$'
    replace: '# \1'
    backup: true
- name: Comment OUTPUT section
  replace:
    path: /etc/fluent-bit/fluent-bit.conf
    regexp: '^\[OUTPUT\]'
    replace: '# [OUTPUT]'
- name: Start fluent-bit
  service: name=fluent-bit state=started enabled=yes
