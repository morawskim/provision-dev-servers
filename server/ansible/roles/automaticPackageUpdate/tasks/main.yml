---
# tasks file for automaticPackageUpdate
- name: Validate supported OS family for msmtp package mapping
  ansible.builtin.assert:
    that:
      - ansible_os_family in msmtp_package_map
    fail_msg: "Unsupported OS family '{{ ansible_os_family }}'. No msmtp package mapping defined."

- name: Install epel-release
  ansible.builtin.package:
    state: present
    name: "epel-release"
  when: ansible_os_family == "RedHat"
- name: Install msmtp
  ansible.builtin.package:
    state: present
    name: "{{ msmtp_package_map[ansible_os_family] }}"
- name: Configure msmtp
  ansible.builtin.copy:
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: '0644'
    content: |
      defaults
      auth off
      tls off
      #logfile /var/log/msmtp.log

      account default
      host 127.0.0.1
      port 25
      from not-important-if-use-gosmtp@example.com

- name: Validate supported OS family for gosmtp package url mapping
  ansible.builtin.assert:
    that:
      - ansible_os_family in gosmtp_package_url
    fail_msg: "Unsupported OS family '{{ ansible_os_family }}'. No gosmtp package mapping defined."
- name: Install gosmtp
  apt:
    deb: "{{ gosmtp_package_url[ansible_os_family] }}"
    state: present
  when: ansible_os_family == "Debian"
- name: Install gosmtp
  ansible.builtin.dnf:
    name: "{{ gosmtp_package_url[ansible_os_family] }}"
    state: present
    disable_gpg_check: true
  when: ansible_os_family == 'RedHat'
- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/gosmtp.service.d
    state: directory
    mode: "0755"
- name: Create /etc/gosmtp-notification-url
  ansible.builtin.copy:
    dest: /etc/gosmtp-notification-url
    owner: root
    group: root
    mode: '0600'
    content: "{{ notification_url }}"
  notify: Reload and restart gosmtp
- name: Add LoadCredential override
  ansible.builtin.copy:
    dest: /etc/systemd/system/gosmtp.service.d/override.conf
    mode: "0644"
    content: |
      [Service]
      LoadCredential=notification_url:/etc/gosmtp-notification-url
  notify: Reload and restart gosmtp
- name: Enable and start gosmtp
  ansible.builtin.service:
    name: gosmtp
    enabled: yes
    state: started

- name: Install dnf-automatic
  package:
    name: dnf-automatic
    state: present
  when: ansible_os_family == 'RedHat'
- name: dnf-automatic - looking for all available updates
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: upgrade_type
    value: "default"
  when: ansible_os_family == 'RedHat'
- name: dnf-automatic - set emit_via to email
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: emitters
    option: emit_via
    value: "email"
  when: ansible_os_family == 'RedHat'
- name: Enable automatic updates
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: email
    option: email_to
    value: "root@example.com"
  when: ansible_os_family == 'RedHat'
- name: Enable and start dnf-automatic-install.timer
  ansible.builtin.systemd:
    name: dnf-automatic-install.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_os_family == 'RedHat'

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Mail "user@example.com";
      Unattended-Upgrade::MailReport "on-change";
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}";
        "${distro_id}:${distro_codename}-security";
        // Extended Security Maintenance; doesn't necessarily exist for
        // every release and this system may not have it installed, but if
        // available, the policy for updates is such that unattended-upgrades
        // should also install from here by default.
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
        "${distro_id}:${distro_codename}-updates";
        //"${distro_id}:${distro_codename}-proposed";
        //"${distro_id}:${distro_codename}-backports";
      {% for repo in additional_repository_origins %}
        "{{ repo }}";
      {% endfor %}
      };
  when: ansible_os_family == "Debian"
